<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f2a"/>
      <stop offset="1" stop-color="#151714"/>
    </linearGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8a48"/>
      <stop offset="1" stop-color="#1f6430"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d66a3c"/>
      <stop offset="1" stop-color="#a8461f"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efece3"/>
    </linearGradient>
    <pattern id="lattice" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H10M0 0V10" stroke="#fff" stroke-opacity=".16" stroke-width="2.5"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <path id="heart" d="M0 9C-12 0 -15 -9 -7.5 -12C-3 -13.5 0 -9 0 -7.5C0 -9 3 -13.5 7.5 -12C15 -9 12 0 0 9Z"/>
    <path id="spade" d="M0 -12C-12 -3 -15 6 -7.5 9C-3 10.5 0 6 0 4.5C0 6 3 10.5 7.5 9C15 6 12 -3 0 -12ZM0 4.5L-4.5 13.5H4.5Z"/>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="50" fill="url(#tile)"/>
  <rect x="17" y="17" width="222" height="222" rx="49" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>

  <g transform="translate(128 230)">
    <!-- green back -->
    <g transform="rotate(-22)" filter="url(#shadow)">
      <rect x="-40" y="-172" width="80" height="112" rx="9" fill="url(#felt)" stroke="#f6f3ea" stroke-width="3"/>
      <rect x="-31" y="-163" width="62" height="94" rx="5" fill="url(#lattice)" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
    </g>
    <!-- rust back -->
    <g transform="rotate(-7.5)" filter="url(#shadow)">
      <rect x="-40" y="-172" width="80" height="112" rx="9" fill="url(#rust)" stroke="#f6f3ea" stroke-width="3"/>
      <rect x="-31" y="-163" width="62" height="94" rx="5" fill="url(#lattice)" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
    </g>
    <!-- ace of spades -->
    <g transform="rotate(7.5)" filter="url(#shadow)">
      <rect x="-40" y="-172" width="80" height="112" rx="9" fill="url(#face)"/>
      <text x="-29" y="-148" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-size="20" fill="#1d1f1c">A</text>
      <use href="#spade" transform="translate(-23 -132) scale(.55)" fill="#1d1f1c"/>
    </g>
    <!-- ace of hearts -->
    <g transform="rotate(22)" filter="url(#shadow)">
      <rect x="-40" y="-172" width="80" height="112" rx="9" fill="url(#face)"/>
      <text x="-29" y="-148" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-size="20" fill="#c8252c">A</text>
      <use href="#heart" transform="translate(-23 -134) scale(.55)" fill="#c8252c"/>
      <use href="#heart" transform="translate(4 -112) scale(1.75)" fill="#c8252c"/>
    </g>
  </g>
</svg>
