[package]
name = "rusty-solitaire"
version = "0.5.0"
edition = "2024"
authors = ["The Rusty Solitaire authors"]
license = "GPL-3.0-or-later"
description = "Rusty Solitaire: a cross-platform Rust port of GNOME Aisleriot Solitaire"
publish = false

[dependencies]
slint = "1.18"
resvg = "0.49"
# Sound effects: the Ogg Vorbis files decoded in Rust.
lewton = "0.10"
# std::time::Instant and SystemTime, which also work in the web build.
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker = "0.1"
# The rules pages opened in the web browser.
open = "5"

# The web build (WebAssembly in a browser page, see web/README.md): settings in
# the browser's local storage, sound through Web Audio, the rules in a new tab.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioBuffer", "AudioBufferSourceNode", "AudioContext", "AudioContextState",
    "AudioDestinationNode", "AudioNode", "AudioScheduledSourceNode", "BaseAudioContext",
    "Blob", "BlobPropertyBag", "Document", "Element", "ResizeObserver", "Storage", "Url",
    "Window",
] }

# Load fontconfig at runtime instead of linking it (enables the option on the
# font library Slint uses). Then building for Linux needs no development
# libraries for the target, which is what makes the ARM64 cross-build easy.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }
# Sound through ALSA, loaded at runtime for the same reason (see sound.rs).
libloading = "0.9"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
cpal = "0.18"

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"

[profile.dev]
# Card themes are rendered with resvg; unoptimised it is painfully slow.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
